# Render.com blueprint — deploy API without Google Cloud Run / billing.
# Dashboard: New → Blueprint → connect repo, or create Web Service manually with same settings.
# Set secret env vars in the Render dashboard (never commit real JSON).

services:
  - type: web
    name: blackpot-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: blackpot-c2794
      - key: DATA_BACKEND
        value: firestore
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWLIST_EMAILS
        sync: false
